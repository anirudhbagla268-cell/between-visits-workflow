<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Between Visits Email Demo</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#faf7f2;--card:#fff;--ink:#1d2a29;--muted:#6b7776;--line:#e6dfd2;--teal:#0a8f82;--orange:#d9683a;--good:#1a7f4b;--bad:#b42318}
@media(prefers-color-scheme:dark){:root{--bg:#141a19;--card:#1c2423;--ink:#eef3f2;--muted:#9fb0ae;--line:#2c3836}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Inter,system-ui,sans-serif}
.wrap{max-width:820px;margin:0 auto;padding:28px 16px 60px}
h1{font:600 28px Fraunces,Georgia,serif;margin:0}.tag{color:var(--muted);margin:2px 0 22px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:16px}
button{background:var(--teal);color:#fff;border:0;border-radius:10px;padding:12px 20px;font:600 15px Inter,sans-serif;cursor:pointer}
button:disabled{opacity:.55;cursor:default}
.step{display:flex;gap:12px;padding:10px 0;border-top:1px solid var(--line)}.step:first-child{border-top:0}
.dot{width:22px;height:22px;border-radius:50%;flex:none;display:grid;place-items:center;font-size:12px;color:#fff;background:var(--line)}
.running .dot{background:var(--orange);animation:p 1s infinite}.done .dot{background:var(--good)}.error .dot{background:var(--bad)}
@keyframes p{50%{opacity:.4}}
.lbl{font-weight:600}.det{color:var(--muted);font-size:13px;word-break:break-word}
pre{white-space:pre-wrap;font:13px/1.5 ui-monospace,Menlo,monospace;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px;margin:8px 0 0}
.err{color:var(--bad);font-weight:600}table{width:100%;border-collapse:collapse;font-size:13px}td,th{text-align:left;padding:6px 8px;border-top:1px solid var(--line)}
</style></head><body><div class="wrap">
<h1>Between Visits</h1><div class="tag">Clinic email outreach agent</div>
<div class="card"><button id="run">Run the workflow</button> <span id="s" class="det"></span></div>
<div class="card" id="steps"></div>
<div class="card" id="out" hidden><b>Email sent</b><div id="meta" class="det"></div><pre id="body"></pre></div>
<div class="card"><b>Send log</b><div id="log" class="det">No sends yet.</div></div>
</div><script>
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
async function draw(){
  const st=await (await fetch("/api/state")).json();
  $("run").disabled=st.status==="running";
  $("s").textContent=st.status==="running"?"Working...":st.status==="done"?"Done":st.status==="error"?"":"";
  $("steps").innerHTML=st.steps.map(s=>`<div class="step ${s.status}"><div class="dot">${s.status==="done"?"✓":s.status==="error"?"!":""}</div><div><div class="lbl">${esc(s.label)}</div><div class="det">${esc(s.detail)}</div></div></div>`).join("")+(st.error?`<div class="err">${esc(st.error)}</div>`:"");
  const r=st.result||{};
  $("out").hidden=!r.to;
  if(r.to){$("meta").textContent=(r.sent?"Sent":"Drafted (dry run)")+" to "+r.to+" · "+(r.practice||"")+" · "+r.source_url;$("body").textContent="Subject: "+r.subject+"\n\n"+r.body}
  const lg=await (await fetch("/api/log")).json();
  if(lg.length)$("log").innerHTML="<table><tr><th>Time</th><th>To</th><th>Practice</th><th>Sent</th></tr>"+lg.reverse().map(x=>`<tr><td>${new Date(x.timestamp).toLocaleTimeString()}</td><td>${esc(x.to)}</td><td>${esc(x.practice)}</td><td>${x.sent?"yes":"dry run"}</td></tr>`).join("")+"</table>";
}
$("run").onclick=async()=>{$("run").disabled=true;await fetch("/api/run",{method:"POST"});draw()};
setInterval(draw,700);draw();
</script></body></html>
